name: Kebab Time Notification

on:
  schedule:
    # Runs at 11:50 AM every Wednesday (AEDT/Sydney time)
    # Accounting for possible GitHub delays, setting to 20 minutes earlier
    # Sydney is UTC+11 (during daylight saving), so 11:30 AM Sydney = 00:30 AM UTC
    - cron: '0 0 * * 3'
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Send kebab notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Array of fun messages
          messages=(
            "🥙 KEBAB TIME! Gather your hunger and your mates - it's kebab o'clock!"
            "🌯 The weekly kebab pilgrimage begins! Time to wrap up work and wrap up some delicious kebab!"
            "⏰ Kebab Wednesday has arrived! Your taste buds' favourite time of the week!"
            "🏃 Quick, to the kebab shop! It's somewhere between 11:30am and 12:30pm on Kebab Wednesday, mate!"
            "🤑 It is me, the Kebab shop owner! I require your weekly kebab money."
            "🤠 It is near-high-noon, my dudes. It's also possibility not noon. I'm a bot built on github workflows. You get what you pay for."
            "💡 Here is an idea, stop what you're doing and get a kebab."
            "🕛 Bong Bong Bong Bong Bong Bong Bong Bong Bong Bong Bong Bong. It's time for a kebab."
            "🍟 Jansen Zhang 的精神告诉你去吃个烤肉串吧 👻"
            "🥙 Oi oi oi! Kebab o'clock has snuck up on us again. Down tools, grab your wallet."
            "🌯 Doner calls! Answer it. It's rude to leave a kebab waiting."
            "🔥 The spit is spinning, the meat is dreaming of you. Go make its day."
            "🥙 Garlic sauce or chilli sauce? Why not both? It's Kebab Wednesday, live a little."
            "🍽️ Halal snack pack, anyone? Chips, meat, cheese, three sauces, zero regrets."
            "🥙 Warning: this notification contains 100% of your recommended daily kebab."
            "🤖 Beep boop. I am legally obligated to remind you: kebab. That is all."
            "🌯 Wrap up that meeting, then wrap yourself around a kebab."
            "🥙 Somewhere, a lamb is spinning slowly on a spit just for you. Don't let it down."
            "🕛 It's either exactly kebab time or vaguely kebab time. Cron is not a precise science."
            "🥙 Mixed meat, extra garlic, the lot. You know what to do."
            "🤑 The kebab shop owner senses a disturbance in the lunch orders. Rectify this."
            "🌯 A kebab a week keeps the sadness at bay. This is not medical advice."
            "🥙 Tabbouleh is a vegetable. This kebab is basically a salad. You're welcome."
            "🔥 Fire up, team. The vertical rotisserie of destiny awaits."
            "🥙 Roses are red, kebabs are savoury, get up from your desk, and show some bravery."
            "🤖 This message brought to you by a robot that will never taste kebab. Live for me."
            "🌯 Chicken or lamb? The eternal question. Answer it in person, at the shop."
            "🥙 Your future self, full of kebab and content, is begging you to go now."
            "🍟 Add chips. You always regret not adding chips."
            "🥙 It's high noon-ish. Draw your... kebab."
            "🤠 Reckon it's about time for a feed, partner. Kebab feed, that is."
            "🌯 The pita has been warmed. The sauces are chilled. The meat is ready. Are you?"
            "🥙 Break glass in case of hunger. You have broken it. Get a kebab."
            "🔥 Weekly reminder that a kebab is a hug you can eat."
            "🥙 No thoughts, head empty, only kebab."
            "🤑 It is I, the kebab merchant, returned once more for your gold coins and appetite."
            "🌯 Meeting ran over? Kebab shop's still open. Priorities, mate."
            "🥙 Studies show 10 out of 10 kebabs would like to be eaten by you today."
            "🍽️ Assemble the crew. The kebab does not eat itself."
            "🥙 Extra garlic sauce is a personality trait, and it's a good one."
            "🤖 I am a humble github workflow. My one purpose in life is this: kebab. Honour it."
            "🌯 A wise person once said nothing, because their mouth was full of kebab."
            "🥙 It's Wednesday, my dudes. And on Wednesdays, we eat kebab."
            "🔥 The lunchtime prophecy is fulfilled. Go forth and snack."
            "🥙 Do a barrel roll, then do a kebab. One of these is more achievable."
            "🤑 Send kebab. Also send money. Mostly the kebab though."
            "🌯 Hunger is temporary. Kebab is forever. (Kebab is also temporary, eat it quick.)"
            "🥙 Your desk misses you, but the kebab shop misses you more."
            "🍟 Halal snack pack: because a normal kebab was simply not enough drama."
            "🥙 Stand up. Stretch. Realise you're hungry. Get a kebab. You're welcome."
            "🤖 Error 404: Kebab not found in your stomach. Resolve immediately."
            "🌯 They say don't count your kebabs before they're wrapped. Go get one wrapped."
            "🥙 The meat sweats are a small price to pay for greatness."
            "🔥 Every Wednesday I return, like the tide, to remind you: kebab."
            "🥙 One does not simply walk past the kebab shop. One walks in."
            "🤠 Yeehaw. It's a rootin' tootin' kebab-shootin' Wednesday."
            "🌯 If you're reading this, it's already kebab time. Probably. Timezones are hard."
            "🥙 Life's too short for a plain sanga when kebabs exist. Choose wisely."
            "🍽️ That's a wrap. Literally. Go and get one."
          )
          
          # Get random message
          random_index=$((RANDOM % ${#messages[@]}))
          message="${messages[$random_index]}"
          
          # Send to Google Chat
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"$message\"}" \
            "$WEBHOOK_URL"
